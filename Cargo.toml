[package]
name = "embedded-nrf"
version = "0.1.1"
edition = "2024"

[features]
default = []

[[bin]]
name = "embedded-nrf"
path = "src/main.rs"
test = false
doctest = false
bench = false

[profile.dev]
debug = 2

[profile.release]
debug = 2

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
embassy-executor = { version = "0.9", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime-us"] }
embassy-sync = { version = "0.8", features = ["defmt"] }
embassy-futures = "0.1"
embassy-nrf = { version = "0.10.0", default-features = false, features = [
        "rt",
        "nrf52840",
        "gpiote",
        # RTC0 + TIMER0 are owned by the MPSL, so the time driver must live on RTC1.
        "time-driver-rtc1",
        "defmt",
        "unstable-pac",
    ]}
# nrf-sdc = { version = "0.4", default-features = false, features = ["defmt", "peripheral", "nrf52840"] }
defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-probe = "1.0.0"
