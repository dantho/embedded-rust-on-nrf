[package]
name = "embedded-nrf"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.9", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5", features = ["defmt"] }
embassy-sync = { version = "0.7", features = ["defmt"] }
embassy-futures = "0.1"

# embassy-stm32 = { version = "0.6.0", features = ["stm32f103vg"] }
embassy-nrf = { version = "0.11", features = [
    "defmt",
    "nrf52840",
    "gpiote",
    # RTC0 + TIMER0 are owned by the MPSL, so the time driver must live on RTC1.
    "time-driver-rtc1",
    "unstable-pac",
] }

nrf-sdc = { version = "0.4", default-features = false, features = ["defmt", "peripheral", "nrf52840"] }
nrf-mpsl = { version = "0.4", default-features = false, features = ["defmt", "critical-section-impl"] }